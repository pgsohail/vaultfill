<!doctype html><meta charset="utf-8"><title>Create account</title><link rel="stylesheet" href="/_style.css">
<h1>Create your account</h1>
<form action="/welcome.html" method="get">
  <input id="name" name="fullname" placeholder="Full name">
  <input id="user" name="email" type="email" placeholder="Email">
  <input id="pass" name="password" type="password" placeholder="Password">
  <input id="pass2" name="password_confirm" type="password" placeholder="Confirm password">
  <button type="submit">Sign up</button>
</form>
