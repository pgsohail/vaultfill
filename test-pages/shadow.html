<!doctype html><meta charset="utf-8"><title>Sign in (web components)</title><link rel="stylesheet" href="/_style.css">
<h1>Sign in</h1>
<login-card id="open"></login-card>
<p>Closed shadow root:</p>
<login-card id="closed" data-mode="closed"></login-card>
<script>
  customElements.define('login-card', class extends HTMLElement {
    connectedCallback() {
      const root = this.attachShadow({ mode: this.dataset.mode || 'open' });
      root.innerHTML = `<style>form{display:grid;gap:8px}input{padding:8px}</style>
        <form><text-field label="Username"></text-field><text-field label="Password" type="password"></text-field><button>Sign in</button></form>`;
      if (this.id === 'closed') window.closedRoot = root;
    }
  });
  // Nested component: the input lives in a *second* shadow root.
  customElements.define('text-field', class extends HTMLElement {
    connectedCallback() {
      const r = this.attachShadow({ mode: 'open' });
      r.innerHTML = `<input aria-label="${this.getAttribute('label')}" type="${this.getAttribute('type') || 'text'}" name="${this.getAttribute('label').toLowerCase()}">`;
    }
  });
</script>
