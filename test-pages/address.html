<!doctype html><meta charset="utf-8"><title>Checkout</title><link rel="stylesheet" href="/_style.css">
<h1>Shipping address</h1>
<form>
  <input id="fn" name="first_name" placeholder="First name"><input id="ln" name="last_name" placeholder="Last name">
  <input id="em" name="email" type="email" placeholder="Email"><input id="ph" name="phone" type="tel" placeholder="Phone">
  <input id="st" name="address1" placeholder="Street address"><input id="ci" name="city" placeholder="City">
  <input id="zp" name="zip" placeholder="ZIP"><select id="co" name="country"><option value="">Country</option><option value="US">United States</option><option value="DE">Germany</option></select>
  <button type="button">Continue</button>
</form>
