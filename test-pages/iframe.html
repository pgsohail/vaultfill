<!doctype html><meta charset="utf-8"><title>Embedded login</title><link rel="stylesheet" href="/_style.css">
<h1>Partner portal</h1>
<p>The login below is served from another origin.</p>
<iframe id="frame" style="width:100%;height:320px;border:1px solid #ddd;border-radius:12px"></iframe>
<script>document.getElementById('frame').src = location.protocol + '//' + (new URLSearchParams(location.search).get('frame') || location.host) + '/login.html';</script>
